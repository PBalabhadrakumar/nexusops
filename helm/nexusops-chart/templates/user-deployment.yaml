apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
      - name: user-service
        image: {{ .Values.image.repositoryPrefix }}/user-service:{{ .Values.user.tag }}
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: {{ .Values.user.port }}
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
spec:
  ports:
  - port: 8001
    targetPort: {{ .Values.user.port }}
  selector:
    app: user-service

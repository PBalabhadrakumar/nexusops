apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      containers:
      - name: product-service
        image: {{ .Values.image.repositoryPrefix }}/product-service:{{ .Values.product.tag }}
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: {{ .Values.product.port }}
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
spec:
  ports:
  - port: 8002
    targetPort: {{ .Values.product.port }}
  selector:
    app: product-service

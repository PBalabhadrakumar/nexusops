apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
      - name: order-service
        image: {{ .Values.image.repositoryPrefix }}/order-service:{{ .Values.order.tag }}
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: {{ .Values.order.port }}
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  ports:
  - port: 8003
    targetPort: {{ .Values.order.port }}
  selector:
    app: order-service

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  location /api/users/    { proxy_pass http://user-service:8001/users/; }
  location /api/products/ { proxy_pass http://product-service:8002/products/; }
  location /api/orders/   { proxy_pass http://order-service:8003/orders/; }
}
